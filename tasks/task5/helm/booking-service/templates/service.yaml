apiVersion: v1
kind: Service
metadata:
  name:  {{ $.Values.appName }}
  annotations:
    networking.istio.io/app-protocol: "http" # <-- Добавьте эту строку
  labels:
    app: {{ $.Values.appName }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app:  {{ $.Values.appName }}
