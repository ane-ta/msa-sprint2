apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: {{ .Values.appName }}-destination-rule
spec:
  host: {{ .Values.appName }}
  subsets:
  - name: stable
    labels:
      version: stable
  - name: canary
    labels:
      version: canary
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Values.appName }}-virtual-service
spec:
  hosts:
  - {{ .Values.appName }}
  http:
  - route:
    - destination:
        host: {{ .Values.appName }}
        subset: stable
      weight: 90
    - destination:
        host: {{ .Values.appName }}
        subset: canary
      weight: 10

  retries:
    attempts: 3
    perTryTimeout: 2s
    retryOn: gateway-error, connect-failure, refused-stream, 5xx