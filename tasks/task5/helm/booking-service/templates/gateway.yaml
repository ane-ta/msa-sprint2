# booking-service/templates/gateway.yaml
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: booking-service-gateway
spec:
  selector:
    istio: ingressgateway # Селектор, который соответствует вашему istio-ingressgateway сервису
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*" # Или укажите ваш домен, если есть
