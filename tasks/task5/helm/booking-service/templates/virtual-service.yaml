apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Values.appName }}-virtual-service
spec:
  hosts:
  # - booking-service
  - "*"
  gateways:
  - booking-service-gateway
  # - mesh
  http:
  - 
    match:
    - headers:
        X-Feature-Enabled:
          exact: "true" 
    route:
    - destination:
        host: {{ .Values.appName }}
        subset: canary 
      weight: 100
  - 
    route:
    - destination:
        host: {{ .Values.appName }}
        subset: stable
      weight: 90
    - destination:
        host: {{ .Values.appName }}
        subset: canary
      weight: 10
      
    retries:
      attempts: 10
      perTryTimeout: 5s
      retryOn: gateway-error,connect-failure,refused-stream,5xx