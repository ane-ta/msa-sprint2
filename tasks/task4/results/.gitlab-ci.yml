stages:
  - build
  - test
  - deploy
  - tag

variables:
  IMAGE_TAG: latest
  IMAGE_NAME: hotelio-booking-service
  SERVICE_CHART_PATH: ./helm/booking-service
  SERVICE_VALUES_PATH: ./helm/booking-service/values.dev.yaml

build:
  stage: build
  script:
    - echo "🏗️ Building Docker image $IMAGE_NAME:$IMAGE_TAG in local Docker Desktop"
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -f Booking-service/Dockerfile .
    - echo "✅ Image built successfully"

test:
  stage: test
  script:
    - echo "🔍 Running image locally and testing /ping endpoint"
    - docker run -d --name test-service -p 8080:8080 $IMAGE_NAME:$IMAGE_TAG
    - sleep 5 
    - curl http://localhost:8080/ping | grep "pong"
    - echo "✅ Service responded with pong"
  
  after_script:
    - docker stop test-service || true
    - docker rm test-service || true

deploy:
  stage: deploy
  script:
    - echo "🚀 Deploying to Minikube cluster"
    # Используем minikube image load для переноса образа из локального Docker Desktop в Minikube
    - minikube image load $IMAGE_NAME:$IMAGE_TAG
    # Обновляем или устанавливаем Helm-чарт (gcl должен иметь доступ к kubectl/helm)
    - helm upgrade --install booking-service $SERVICE_CHART_PATH -f $SERVICE_VALUES_PATH
    - echo "✅ Deployment initiated."

tag:
  stage: tag
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
  script:
    - echo "🏷️ Starting the tagging process..."
    # Генерируем имя тега на основе даты и времени
    - export TAG_NAME="build-$(date +%Y-%m-%d-%H-%M-%S)"
    - echo "   Generated tag name '$TAG_NAME'"
    
    # Создаем локальный тег
    - git tag $TAG_NAME
    - echo "   Local tag created."
    
    # Отправляем новый тег в удаленный репозиторий GitLab
    - echo "   Pushing tag to origin..."
    - git push origin $TAG_NAME
    
    - echo "✅ Tag $TAG_NAME created and pushed successfully to GitLab."